# Canto-L metric learning on TrackML (docs/trackml_plan.md section 6.1): the recipe of configs/baseline/ml_train.yaml
# unchanged (acorn Example_2 3-feature recipe: MLP 4 x 1024 Tanh -> 12-D, hinge margin 0.1, r_train 0.1, knn 50,
# natural weighting, undirected truth, inputs r, phi, z; no hard cuts: every hit, noise included, condition C-full).
# Only the sampling differs: hnl.trackml.ml.TrackMLMetricLearning draws events_per_epoch training events per virtual
# epoch from seeded permutations that cycle through every training event (acorn's own loader does not shuffle,
# DECISIONS.md 2026-10-03 22:05 UTC); 30 virtual epochs x 1,000 events = 30,000 event steps; points_per_batch 50,000 of
# about 110k hits. Checkpoint: best valmon f1 (50 valmon events, as for HNL). input_dir / stage_dir / data_split /
# max_epochs are set by hnl.train.acorn_runner per run (input_dir = the node-local acorn feature store written by
# `hnl.trackml.graphs fs`). ml_seed is set per run by slurm/trackml/ml_train.sbatch.
# knn_val 1000 as the baseline; G0 checks its memory on 110k-hit valmon events (FRNN K x N indices).
stage: graph_construction
model: hnl.trackml.ml.TrackMLMetricLearning
accelerator: gpu
devices: 1
nodes: 1
log_wandb: false
num_workers: [4, 4, 4]
weighting:
  - weight: 1.0
    conditions:
      y: true
undirected: true
train_undirected: true
node_features: [r, phi, z]
node_scales: [1000, 3.14, 1000]
emb_hidden: 1024
nb_layer: 4
emb_dim: 12
activation: Tanh
randomisation: 1
points_per_batch: 50000
r_train: 0.1
knn: 50
knn_val: 1000
warmup: 5
margin: 0.1
lr: 0.01
factor: 0.7
patience: 10
max_epochs: 30
metric_to_monitor: f1
metric_mode: max
# TrackML sampling (hnl.trackml.ml)
events_per_epoch: 1000
