# Canto-L edge classifier on TrackML (docs/trackml_plan.md section 6.4): configs/stage1/triplet_symregion_trunc.yaml
# unchanged (L1 SymmetricTripletIGNN with the region one-hot, hidden 128, 8 iterations, triplet top-k 4, natural
# weighting, inner-hit truncation p = 0.3, warmup 5, StepLR x 0.9 every 10 epochs), trained on TrackML sector windows
# instead of whole events (hnl.trackml.classifier). Only the data keys below differ.
#   * an epoch is a virtual epoch of windows_per_epoch random windows (plan: 30 virtual epochs x 4,000 windows =
#     120,000 steps of one window); the learning-rate schedule runs per virtual epoch as configured;
#   * training windows: a 22.5 deg core at a random azimuth with +-11.25 deg halos (1/8 of the event); the loss and the
#     edge metrics use the core-owned edges only (edge weight 0 on the context edges);
#   * valmon (checkpoint selection, lowest val_loss) and scoring: the 8 inference sectors of each event (45 deg cores,
#     +-22.5 deg halos), loss on owned edges;
#   * window_seed is set per run by slurm/trackml/classifier_train.sbatch (the training seed).
# input_dir / stage_dir / data_split / max_epochs are set by hnl.train.acorn_runner per run (input_dir = the node-local
# event store written by `hnl.trackml.graphs stage`).
model: hnl.trackml.classifier.TrackMLCanto
stage: edge_classifier
accelerator: gpu
devices: 1
nodes: 1
log_wandb: false
num_workers: [4, 4, 4]
edge_cut: 0.5
undirected: true
undirected_message_passing: true
node_features: [r, phi, z]
node_scales: [1000, 3.14, 1000]
hidden: 128
n_graph_iters: 8
nb_node_layer: 2
nb_edge_layer: 2
layernorm: true
batchnorm: false
aggregation: sum
hidden_activation: SiLU
output_activation: Tanh
warmup: 5
scheduler: StepLR
lr: 0.001
factor: 0.9
patience: 10
max_epochs: 30
triplet_topk: 4
detector_input: region
# TrackML data keys (hnl.trackml.classifier.TrackMLSectorDataset)
trunc_p: 0.3
windows_per_epoch: 4000
train_window:
  core_width_deg: 22.5
  halo_phi_deg: 11.25
inference_sectors:
  n_phi: 8
  halo_phi_deg: 22.5
