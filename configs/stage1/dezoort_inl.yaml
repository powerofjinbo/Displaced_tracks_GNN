# Stage 1 reference: the DeZoort IN-L (hnl.models.dezoort_in; hidden 128, 3 rounds, ~127k parameters) on the same graphs.
model: hnl.models.dezoort_in.DeZoortIN
stage: edge_classifier
accelerator: gpu
devices: 1
nodes: 1
log_wandb: false
num_workers: [4, 4, 4]
edge_cut: 0.5
undirected: true
undirected_message_passing: true
node_features: [r, phi, z]
node_scales: [1000, 3.14, 1000]
warmup: 5
scheduler: StepLR
lr: 0.001
factor: 0.9
patience: 10
max_epochs: 100
dz_hidden: 128
dz_rounds: 3
