# Secondary-particle upweighting test (docs/secondary_upweight_plan.md): the Canto classifier (L1 + inner-hit truncation,
# configs/stage1/triplet_symregion_trunc.yaml, unchanged below the model line) with the true edges of training-event
# particles with truth |d0| >= secw_d0_mm weighted secw_weight in the loss (hnl.models.secondary_weight).
model: hnl.models.secondary_weight.TruncSecWeightSymmetricTripletIGNN
stage: edge_classifier
accelerator: gpu
devices: 1
nodes: 1
log_wandb: false
num_workers: [4, 4, 4]
edge_cut: 0.5
undirected: true
undirected_message_passing: true
node_features: [r, phi, z]
node_scales: [1000, 3.14, 1000]
hidden: 128
n_graph_iters: 8
nb_node_layer: 2
nb_edge_layer: 2
layernorm: true
batchnorm: false
aggregation: sum
hidden_activation: SiLU
output_activation: Tanh
warmup: 5
scheduler: StepLR
lr: 0.001
factor: 0.9
patience: 10
max_epochs: 100
triplet_topk: 4
detector_input: region
secw_d0_mm: 10.0
secw_weight: 18.0
