# Baseline InteractionGNN (brief §5f): acorn examples/Example_3/gnn_train.yaml (hidden 128, 8 iterations, 263,937
# parameters) with: no hard_cuts, natural weighting (no weighting key: every edge weight 1), undirected truth and
# message passing written explicitly, no wandb, explicit workers. input_dir / stage_dir / data_split / max_epochs are
# set by hnl.train.acorn_runner per run.
stage: edge_classifier
model: InteractionGNN
accelerator: gpu
devices: 1
nodes: 1
log_wandb: false
num_workers: [4, 4, 4]
edge_cut: 0.5
undirected: true
undirected_message_passing: true
node_features: [r, phi, z]
node_scales: [1000, 3.14, 1000]
hidden: 128
n_graph_iters: 8
nb_node_layer: 2
nb_edge_layer: 2
layernorm: true
batchnorm: false
aggregation: sum
hidden_activation: SiLU
output_activation: Tanh
warmup: 5
scheduler: StepLR
lr: 0.001
factor: 0.9
patience: 10
max_epochs: 100
